name: Daily Job Scan Pipeline

on:
  schedule:
    # 10:30 UTC = 4:00 PM IST, chosen with a ~2.5hr buffer past the latest
    # possible Gemini free-tier quota reset (1:30 PM IST in winter/PST).
    # IST has no DST, so this UTC time never needs seasonal adjustment.
    - cron: "30 10 * * *"
  workflow_dispatch: {}

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt --break-system-packages

      - name: Reconstruct Google service account key file
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON_CONTENT" > service_account.json
          python3 -c "import json; json.load(open('service_account.json'))" && echo "service_account.json is valid JSON" || echo "WARNING: service_account.json is NOT valid JSON -- check the secret's value"
        # Passing the secret through an env var (not interpolating it
        # directly into the shell command text) matters: direct
        # interpolation inside a quoted echo can break if the JSON
        # contains certain characters, producing an invalid/truncated
        # file. This is the robust pattern for JSON secrets in Actions.
        # The validation line below catches a bad secret immediately,
        # in this step's own log, rather than failing confusingly two
        # steps later inside Stage 4a.

      - name: Run Stage 1 (pull job postings)
        working-directory: src
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -u stage1_pull.py

      - name: Run Stage 1.5 (dealbreaker tagging — free, no API calls)
        working-directory: src
        run: python -u stage1_5_tag.py

      - name: Run Stage 2 (fit scoring)
        working-directory: src
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u stage2_score.py

      - name: Run Stage 4a (write to Google Sheet)
        working-directory: src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ github.workspace }}/service_account.json
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
        run: python -u stage4_sheets.py

      - name: Run Stage 4b (Telegram digest)
        working-directory: src
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
        run: python -u telegram_digest.py

      - name: Clean up credential file
        if: always()
        run: rm -f service_account.json

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_USER_ID }}" \
            -d text="⚠️ Job scan pipeline FAILED today. Check the run for details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        # Runs ONLY if an earlier step in this job failed (if: failure()).
        # Fires on the same channel as your daily digest, so a broken run
        # is impossible to miss the way a GitHub notification email could
        # be. The link goes straight to this specific run's logs.
